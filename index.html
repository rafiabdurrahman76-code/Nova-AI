<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nova — AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" id="app">

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2 L14.5 9.2 L22 12 L14.5 14.8 L12 22 L9.5 14.8 L2 12 L9.5 9.2 Z" fill="url(#g)"/><defs><linearGradient id="g" x1="2" y1="2" x2="22" y2="22"><stop offset="0" stop-color="#8b7dff"/><stop offset="1" stop-color="#37d6c3"/></linearGradient></defs></svg>
        </span>
        <span class="brand-name">Nova</span>
      </div>
      <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Close sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New chat
    </button>

    <div class="sidebar-section-label">Recent</div>
    <nav class="history-list" id="historyList">
      </nav>

    <div class="sidebar-bottom">
      <div class="user-chip">
        <span class="user-avatar">G</span>
        <div class="user-meta">
          <span class="user-name">Guest</span>
          <span class="user-sub">Free plan</span>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn sidebar-open" id="sidebarOpen" aria-label="Open sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
      <div class="topbar-title">
        <span id="topbarTitle">New chat</span>
      </div>
      <button class="icon-btn" id="clearChatBtn" aria-label="Clear conversation" title="Clear conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/></svg>
      </button>
    </header>

    <div class="chat-scroll" id="chatScroll">

      <section class="welcome" id="welcome">
        <div class="welcome-mark">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2 L14.5 9.2 L22 12 L14.5 14.8 L12 22 L9.5 14.8 L2 12 L9.5 9.2 Z" fill="url(#g2)"/><defs><linearGradient id="g2" x1="2" y1="2" x2="22" y2="22"><stop offset="0" stop-color="#8b7dff"/><stop offset="1" stop-color="#37d6c3"/></linearGradient></defs></svg>
        </div>
        <h1>Hi, I'm Nova.</h1>
        <p>Ask me anything — I can explain, write, plan, or help you think something through, in English or বাংলা.</p>

        <div class="prompt-cards" id="promptCards">
          <button class="prompt-card" data-prompt="Explain quantum computing in simple terms">
            <span class="pc-icon">💡</span>
            <span class="pc-text">Explain quantum computing in simple terms</span>
          </button>
          <button class="prompt-card" data-prompt="Write a short professional email requesting a deadline extension">
            <span class="pc-icon">✍️</span>
            <span class="pc-text">Write a professional email requesting a deadline extension</span>
          </button>
          <button class="prompt-card" data-prompt="আমাকে একটি সাপ্তাহিক পড়াশোনার পরিকল্পনা তৈরি করে দাও">
            <span class="pc-icon">📅</span>
            <span class="pc-text">আমাকে একটি সাপ্তাহিক পড়াশোনার পরিকল্পনা তৈরি করে দাও</span>
          </button>
          <button class="prompt-card" data-prompt="Give me a JavaScript function to debounce user input">
            <span class="pc-icon">{ }</span>
            <span class="pc-text">Give me a JavaScript function to debounce user input</span>
          </button>
        </div>
      </section>

      <div class="messages" id="messages"></div>

    </div>

    <div class="composer-wrap">
      <form class="composer" id="composerForm">
        <textarea
          id="messageInput"
          class="composer-input"
          placeholder="Message Nova… (Shift+Enter for new line)"
          rows="1"
          autocomplete="off"
        ></textarea>
        <button type="submit" class="send-btn" id="sendBtn" disabled aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="6 11 12 5 18 11"/></svg>
        </button>
      </form>
      <div class="composer-hint">Nova can make mistakes. Consider checking important information.</div>
    </div>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
